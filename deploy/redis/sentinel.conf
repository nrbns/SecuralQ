# Lab Redis Sentinel stub — NOT a production HA proof.
# docker compose --profile redis-ha up -d
#
# App:
#   REDIS_SENTINEL_HOSTS=redis-sentinel:26379
#   REDIS_SENTINEL_MASTER=mymaster
#   # leave REDIS_URL empty when using Sentinel
#
# Docker Desktop note: after redis-primary container stop, automatic promote can
# stall in select_slave. Lab measure script may issue SENTINEL FAILOVER and
# records failover_forced=true when that assist is used.

port 26379
dir /tmp
sentinel resolve-hostnames yes
sentinel monitor mymaster redis-primary 6379 1
sentinel down-after-milliseconds mymaster 2000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 30000
