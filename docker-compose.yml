networks:
  securaiq-internal:
    driver: bridge
    name: securaiq-internal

services:
  # Default app profile — lab / closed-beta on a single host.
  # For SaaS: docker compose --profile saas up -d
  #   and set required secrets in .env (no weak defaults).
  securaiq:
    build: .
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      # Never use "*" in production. Override via .env for your real origin(s).
      CORS_ORIGINS: "${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      AUTH_ENABLED: "true"
      AUTH_ALLOW_REGISTER: "false"
      WORKSPACE_ZERO_START: "false"
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-lab}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      # Required for first boot — set in .env. Empty disables bootstrap user creation.
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}"
      MFA_REQUIRED_FOR_ADMIN: "${MFA_REQUIRED_FOR_ADMIN:-true}"
      MODEL_BACKEND: "${MODEL_BACKEND:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      DATA_DIR: "/data"
      CHROMA_PERSIST_DIR: "/data/chroma"
      QDRANT_URL: "${QDRANT_URL:-}"
      QDRANT_COLLECTION: "securaiq_knowledge"
      DATABASE_URL: "${DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-http://127.0.0.1:8080/api/auth/oidc/callback}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
    volumes:
      - securaiq-data:/data
    networks:
      - securaiq-internal
    restart: unless-stopped

  # SaaS profile: Postgres is the source of truth (internal network only).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securaiq
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for saas profile}"
      POSTGRES_DB: securaiq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published to the host by default — app reaches it on the compose network.
    expose:
      - "5432"
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["postgres", "saas"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securaiq -d securaiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Internal only — use REDIS_URL=redis://redis:6379/0 from the app container.
    expose:
      - "6379"
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["redis", "saas"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lab Redis HA stub (Sentinel) — not a production failover certification.
  # docker compose --profile redis-ha up -d
  # App: REDIS_SENTINEL_HOSTS=redis-sentinel:26379 REDIS_SENTINEL_MASTER=mymaster
  redis-primary:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["redis-ha"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis-primary", "6379"]
    depends_on:
      redis-primary:
        condition: service_healthy
    expose:
      - "6379"
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["redis-ha"]

  redis-sentinel:
    image: redis:7-alpine
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-primary:
        condition: service_healthy
    expose:
      - "26379"
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["redis-ha"]

  # Optional: publish DB/Redis to localhost for debugging (never on public hosts).
  postgres-debug:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securaiq
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: securaiq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["debug-ports"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securaiq -d securaiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-debug:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["debug-ports"]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["vectors"]

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
    networks:
      - securaiq-internal
    restart: unless-stopped
    profiles: ["prefect"]

  # Opinionated SaaS app — reverse proxy in front; do not put on a public IP alone.
  # App is internal-only (expose). Use profile `proxy` (Caddy) for HTTPS on 80/443.
  securaiq-saas:
    build: .
    profiles: ["saas"]
    command: ["python", "scripts/db_migrate_and_run.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DEPLOYMENT_MODE: "production"
      CORS_ORIGINS: "${CORS_ORIGINS:?Set CORS_ORIGINS to your HTTPS origin(s)}"
      AUTH_ENABLED: "true"
      AUTH_ALLOW_REGISTER: "false"
      WORKSPACE_ZERO_START: "false"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}"
      MFA_REQUIRED_FOR_ADMIN: "true"
      COOKIE_SECURE: "true"
      FORCE_HTTPS_HEADERS: "true"
      REQUIRE_POSTGRES_IN_PRODUCTION: "true"
      DATABASE_URL: "postgresql://securaiq:${POSTGRES_PASSWORD}@postgres:5432/securaiq"
      REDIS_URL: "redis://redis:6379/0"
      DATA_DIR: "/data"
      CHROMA_PERSIST_DIR: "/data/chroma"
      MODEL_BACKEND: "${MODEL_BACKEND:-ollama}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    volumes:
      - securaiq-data:/data
    networks:
      - securaiq-internal
    restart: unless-stopped

  # TLS reverse proxy — docker compose --profile saas --profile proxy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - securaiq-saas
    networks:
      - securaiq-internal
    restart: unless-stopped

volumes:
  securaiq-data:
  postgres-data:
  qdrant-data:
  caddy-data:
  caddy-config:
