[package]
name = "securaiq-agent"
version = "0.1.0"
edition = "2021"
description = "SecuraIQ cross-platform endpoint agent (Rust core + OS adapters)"
license = "Proprietary"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
dirs = "5"
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
