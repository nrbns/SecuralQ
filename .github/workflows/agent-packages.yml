name: Agent packages

# Build SecuraIQ native-agent install packages for Windows / Linux / macOS.
# Artifacts land under dist/agent-packages/ and are uploaded per OS.
#
# Windows → .exe + .zip
# Ubuntu  → .tar.gz (native binary)
# macOS   → .tar.gz + .dmg
#
# Does not claim production scale. Authorized lab / owned-host agents only.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "agent-v*"
      - "v*"
  pull_request:
    paths:
      - "scripts/securaiq_agent.py"
      - "scripts/build_agent_packages.py"
      - "scripts/packaging/**"
      - "packaging/securaiq_agent.spec"
      - "securaiq-agent/**"
      - ".github/workflows/agent-packages.yml"

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build agent packages (Rust preferred)
        shell: bash
        run: |
          python -m pip install -q "pyinstaller>=6.3"
          # Prefer the cross-platform Rust agent; PyInstaller remains a fallback.
          EXTRA=""
          if [[ "${{ matrix.platform }}" == "windows" ]]; then EXTRA="--msi"; fi
          if [[ "${{ matrix.platform }}" == "linux" ]]; then EXTRA="--deb --rpm"; fi
          if command -v cargo >/dev/null 2>&1; then
            python scripts/build_agent_packages.py --platform ${{ matrix.platform }} --rust $EXTRA || \
              python scripts/build_agent_packages.py --platform ${{ matrix.platform }} --rust
          else
            python scripts/build_agent_packages.py --platform ${{ matrix.platform }} $EXTRA || \
              python scripts/build_agent_packages.py --platform ${{ matrix.platform }}
          fi

      - name: Authenticode sign (Windows, secrets-gated)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SIGN_WINDOWS: ${{ secrets.SIGN_WINDOWS }}
          CODE_SIGN_THUMBPRINT: ${{ secrets.CODE_SIGN_THUMBPRINT }}
          CODE_SIGN_PFX_PATH: ${{ secrets.CODE_SIGN_PFX_PATH }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
        run: |
          if ($env:SIGN_WINDOWS -notin @('1','true','yes')) {
            Write-Host 'Authenticode skipped (set repo secret SIGN_WINDOWS=1 + cert material to enable)'
            exit 0
          }
          if ($env:CODE_SIGN_PFX_BASE64) {
            $bytes = [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64)
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, $bytes)
            $env:CODE_SIGN_PFX_PATH = $pfx
          }
          ./scripts/packaging/sign_windows.ps1 -ArtifactDir dist/agent-packages

      - name: Sign .deb (Linux, secrets-gated)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          SIGN_DEB: ${{ secrets.SIGN_DEB }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ "${SIGN_DEB:-}" != "1" && "${SIGN_DEB:-}" != "true" && "${SIGN_DEB:-}" != "yes" ]]; then
            echo "dpkg-sig skipped (set SIGN_DEB=1 + GPG secrets to enable)"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-sig gnupg || true
          if [[ -n "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          bash scripts/packaging/sign_deb.sh dist/agent-packages

      - name: Sign .rpm (Linux, secrets-gated)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          SIGN_RPM: ${{ secrets.SIGN_RPM }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ "${SIGN_RPM:-}" != "1" && "${SIGN_RPM:-}" != "true" && "${SIGN_RPM:-}" != "yes" ]]; then
            echo "rpm --addsign skipped (set SIGN_RPM=1 + GPG secrets to enable)"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm gnupg || true
          if [[ -n "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          bash scripts/packaging/sign_rpm.sh dist/agent-packages

      - name: Notarize macOS (secrets-gated)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          NOTARIZE_MACOS: ${{ secrets.NOTARIZE_MACOS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          if [[ "${NOTARIZE_MACOS:-}" != "1" && "${NOTARIZE_MACOS:-}" != "true" && "${NOTARIZE_MACOS:-}" != "yes" ]]; then
            echo "notarization skipped (set NOTARIZE_MACOS=1 + Apple secrets to enable)"
            exit 0
          fi
          bash scripts/packaging/notarize_macos.sh dist/agent-packages

      - name: List artifacts
        shell: bash
        run: |
          ls -la dist/agent-packages/ || true
          cat dist/agent-packages/MANIFEST.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securaiq-agent-${{ matrix.platform }}
          path: dist/agent-packages/*
          if-no-files-found: error
          retention-days: 14
