name: Tests

# Unit/behavioral test suite (pytest) for SecuraIQ — scanner adapters (incl.
# the Burp Suite XML importer), the realtime pub/sub bus, the integrations
# catalog, config defaults, and tools-registry dispatch integrity. Runs on
# every push/PR so a regression is caught in CI, not just when someone
# remembers to run pytest locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (unit + behavioral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # Deliberately not the full requirements.txt — the test suite is
        # scoped to avoid the heavy chromadb/sentence-transformers chain so
        # CI stays fast. Add packages here only if a new test needs them.
        run: pip install pydantic pydantic-settings httpx pytest pytest-asyncio cryptography argon2-cffi
      - name: Run test suite
        # test_siem_api.py imports app.wazuh_api -> app.commercial_api ->
        # app.uploads -> app.rag, which pulls in chromadb + sentence-transformers
        # (multi-GB with torch) — outside the deliberately light dependency set
        # this job installs above. Skip it here; run the full suite (including
        # it) locally with `pip install -r requirements.txt -r requirements-dev.txt`.
        run: pytest -v --ignore=tests/test_siem_api.py

  # Sprint 1 / Phase 1 — release gate: closed-loop acceptance + once-only /
  # XAUTOCLAIM / DLQ / SSE replay. Fail this job ⇒ do not claim realtime P0 done.
  phase1-realtime-gate:
    name: Phase 1 realtime release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gate dependencies
        run: pip install pydantic pydantic-settings httpx pytest pytest-asyncio cryptography argon2-cffi
      - name: Phase 1 gate (acceptance + durability + once-only)
        run: >
          pytest -v
          tests/test_realtime_acceptance_local.py
          tests/test_host_command_verification.py
          tests/test_phase_a_live_compliance_risk.py
          tests/test_wave1_complete.py
          tests/test_master_checklist_p0.py
          tests/test_master_checklist_phases.py
          tests/test_close_all_partials.py
          tests/test_realtime_phase1_proof.py
          tests/test_stream_durability.py
          tests/test_redis_dlq_ops.py
          tests/test_realtime_bus.py
          tests/test_realtime_rt02_rt06.py
          tests/test_realtime_p0_ui_events.py
          tests/test_realtime_ops_remaining.py
          tests/test_realtime_failure_scenarios.py
          tests/test_control_plane_closes.py
          tests/test_realtime_production_closes.py
          tests/test_realtime_chaos_local.py
          tests/test_partial_closes_lab_production.py
          tests/test_fabric_agent_security_lab.py
          tests/test_usp_lab_closes.py
          tests/test_realtime_remaining_full.py
          tests/test_sprints_2_6_foundations.py
      - name: Backup-restore drill (#229)
        run: python scripts/backup_restore_drill.py
      - name: Sentinel HA measure dry-run
        run: python scripts/sentinel_failover_measure.py --dry-run
      - name: Remaining ops proof (soak + sentinel pipeline + signing scaffolds)
        run: python scripts/realtime_ops_remaining_proof.py
      - name: Remaining full proof (failover sim + lab codesign + optional Redis)
        run: python scripts/realtime_remaining_full_proof.py
      - name: Release test #1 — firewall golden loop (--firewall-only)
        run: python scripts/realtime_acceptance_demo.py --local --firewall-only
      - name: Acceptance demo --local (firewall + Defender + SSH)
        run: python scripts/realtime_acceptance_demo.py --local
      - name: Phase 1 simulate once-only
        run: python scripts/realtime_phase1_proof.py --simulate

  # #252 — Postgres matrix (schema/smoke; SQLite remains default lab path)
  pytest-postgres:
    name: pytest (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: securaiq
          POSTGRES_PASSWORD: securaiq_ci
          POSTGRES_DB: securaiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securaiq -d securaiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pydantic pydantic-settings httpx pytest pytest-asyncio cryptography argon2-cffi psycopg[binary]
      - name: Postgres dialect smoke (#252)
        env:
          DATABASE_URL: postgresql://securaiq:securaiq_ci@localhost:5432/securaiq
        run: python scripts/postgres_ci_smoke.py
      - name: Checklist tests
        run: >
          pytest -v
          tests/test_master_checklist_p0.py
          tests/test_master_checklist_phases.py
          tests/test_close_all_partials.py